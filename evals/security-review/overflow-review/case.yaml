name: overflow-review
prompt: |
  Review this C allocation helper for security and correctness bugs. Do not rewrite unrelated style; report exact findings with file/line, trigger condition, and minimal fix:
  ```c
  void *alloc_table(size_t count, size_t elem_size) {
      size_t total = count * elem_size;
      void *p = malloc(total);
      if (!p) return NULL;
      memset(p, 0, total);
      return p;
  }
  ```
assertions:
  - Identifies integer overflow in `count * elem_size` leading to undersized `malloc` and heap buffer overflow in `memset`
  - Notes `calloc(count, elem_size)` or explicit overflow check (`count > SIZE_MAX / elem_size`) as the minimal fix
  - Notes `count == 0` / `elem_size == 0` edge case or `malloc(0)` behavior
