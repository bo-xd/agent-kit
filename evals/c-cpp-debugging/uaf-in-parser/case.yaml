name: uaf-in-parser
prompt: |
  Fix the intermittent crash in main.c so `make test` passes cleanly under ASan/UBSan.
  Do not weaken compiler flags or remove the p2 test case in main().
assertions:
  - Builds and runs `make test` with AddressSanitizer/UBSan passing (exit 0)
  - Fixes the use-after-free on p->buf when p->len == 0 (e.g. sets p->buf = NULL after free or frees after log_packet)
  - Preserves both p1 and p2 checks in main()
